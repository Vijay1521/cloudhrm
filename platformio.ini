; Optional PlatformIO build of the same sources (the Arduino IDE / arduino-cli
; build via sketch.yaml is the primary one). espressif8266 4.2.1 = Arduino core 3.1.2.
;
; PlatformIO does NOT sign firmware (that is an Arduino-IDE/arduino-cli build step).
; A PlatformIO build therefore has GitHub updates switched off and accepts unsigned
; uploads. Use it for development only; releases come from the GitHub workflow.

[platformio]
src_dir = .
default_envs = nodemcuv2

[env]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m1m.ld
board_build.filesystem = littlefs
build_flags = -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH -Wall
; PlatformIO compiles the .ino as a generated CloudHRM_v2.ino.cpp next to it.
build_src_filter = -<*> +<CloudHRM_v2.ino.cpp> +<src/>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
  adafruit/Adafruit SSD1306@2.5.17
  adafruit/Adafruit GFX Library@1.12.6
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit Fingerprint Sensor Library@2.1.4
  miguelbalboa/MFRC522@1.4.12
  knolleary/PubSubClient@2.8
monitor_speed = 115200
upload_speed = 921600

[env:nodemcuv2]

[env:nodemcuv2_ota]
upload_protocol = espota
; Set these, or pass them on the command line:
upload_port = 192.168.1.50
upload_flags = --auth=CHANGE_ME
